plugins {
    id 'com.android.application'
}

android {
    namespace 'it.distinta.trasferte'
    compileSdk 34

    defaultConfig {
        applicationId 'it.distinta.trasferte'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Firma personale: tutte le versioni installate sul tuo telefono usano la stessa chiave,
    // così un nuovo APK si installa sopra il vecchio senza perdere i dati. Non serve per uso pubblico.
    signingConfigs {
        personal {
            storeFile file('../distinta.jks')
            storePassword 'distinta-trasferte'
            keyAlias 'distinta'
            keyPassword 'distinta-trasferte'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.personal
        }
        release {
            signingConfig signingConfigs.personal
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
