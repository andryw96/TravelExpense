<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Distinta trasferte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Token semantici: nessun colore fuori da questo blocco ---------- */
:root{
  color-scheme: light;
  --bg:#EDEFF2; --surface:#FFFFFF; --raised:#F5F6F8;
  --ink:#12161C; --ink-2:#414957; --ink-3:#5F6876;
  --line:#D8DCE3; --line-strong:#B4BAC6;
  --accent:#2A3FD9; --accent-ink:#FFFFFF; --accent-soft:#E4E8FD;
  --ok:#0B7A5F; --ok-soft:#D9F2EA;
  --warn:#B4400B; --warn-soft:#FBE4D6;
  --trip-1:#2A3FD9; --trip-2:#0B7A5F; --trip-3:#B4400B; --trip-4:#8A3FB5; --trip-5:#8F6A00;
  --kind-off:var(--trip-1); --kind-gen:var(--trip-4);
  --pie-1:#2A3FD9; --pie-2:#0B7A5F; --pie-3:#B4400B; --pie-4:#8A3FB5; --pie-5:#8F6A00; --pie-6:#0A6E8A; --pie-7:#B0306A; --pie-8:#5F6876;
  --shadow-color:18 22 28; --scrim:10 12 16;
  /* palette di stampa del PDF (il modulo cartaceo e' in bianco e nero, resta uguale nei due temi) */
  --print-ink:#111111; --print-line:#7A7A7A; --print-faint:#C4C4C4; --print-fill:#EDEDED; --print-paper:#FFFFFF;
  --font-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121212; --surface:#1E1E20; --raised:#29292C;
    --ink:#F2F3F5; --ink-2:#C3C8D1; --ink-3:#9AA1AE;
    --line:#35363B; --line-strong:#4D4F57;
    --accent:#9AA8FF; --accent-ink:#0E1330; --accent-soft:#262B57;
    --ok:#4FD1AE; --ok-soft:#173A32;
    --warn:#FFA06B; --warn-soft:#452A1B;
    --trip-1:#9AA8FF; --trip-2:#4FD1AE; --trip-3:#FFA06B; --trip-4:#D9A6F5; --trip-5:#F0C24B;
    --pie-1:#9AA8FF; --pie-2:#4FD1AE; --pie-3:#FFA06B; --pie-4:#D9A6F5; --pie-5:#F0C24B; --pie-6:#5CC8E8; --pie-7:#FF8DB8; --pie-8:#9AA1AE;
    --shadow-color:0 0 0; --scrim:0 0 0;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1E1E20; --raised:#29292C;
  --ink:#F2F3F5; --ink-2:#C3C8D1; --ink-3:#9AA1AE;
  --line:#35363B; --line-strong:#4D4F57;
  --accent:#9AA8FF; --accent-ink:#0E1330; --accent-soft:#262B57;
  --ok:#4FD1AE; --ok-soft:#173A32;
  --warn:#FFA06B; --warn-soft:#452A1B;
  --trip-1:#9AA8FF; --trip-2:#4FD1AE; --trip-3:#FFA06B; --trip-4:#D9A6F5; --trip-5:#F0C24B;
  --pie-1:#9AA8FF; --pie-2:#4FD1AE; --pie-3:#FFA06B; --pie-4:#D9A6F5; --pie-5:#F0C24B; --pie-6:#5CC8E8; --pie-7:#FF8DB8; --pie-8:#9AA1AE;
  --shadow-color:0 0 0; --scrim:0 0 0;
}

/* ---------- Base ---------- */
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--font-body); -webkit-text-size-adjust:100%; }
body.lock{ overflow:hidden; }
h1,h2,h3,p{ margin:0; }
button{ font:inherit; color:inherit; cursor:pointer; }
input,select{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.num{ font-variant-numeric:tabular-nums; }
.wrap{ max-width:640px; margin:0 auto; padding:0 16px 120px; }
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.top-in{ max-width:640px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:8px; min-height:56px; }
.top h1{ font:700 20px/1.2 var(--font-display); letter-spacing:-.01em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.icon-btn{ width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none; }
.icon-btn svg{ width:22px; height:22px; }
.k{ display:block; font-size:13px; color:var(--ink-3); font-weight:500; }
.hint{ font-size:14px; color:var(--ink-2); }
.pos{ color:var(--ok); } .neg{ color:var(--warn); }

/* ---------- Bottoni, chip, campi ---------- */
.btn{ min-height:48px; padding:0 18px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.block{ width:100%; }
.btn.danger{ color:var(--warn); border-color:var(--warn); background:transparent; }
.btn.quiet{ border-color:transparent; background:transparent; color:var(--accent); padding:0 10px; min-height:44px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn svg{ width:20px; height:20px; }
.chip{ min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-weight:500; font-size:15px; }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip.sm{ min-height:36px; padding:0 12px; font-size:14px; }
.seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid var(--line-strong); border-radius:12px; overflow:hidden; background:var(--surface); }
.seg button{ min-height:48px; border:0; border-right:1px solid var(--line); background:transparent; padding:4px 6px; font-weight:600; font-size:15px; line-height:1.2; }
.seg button:last-child{ border-right:0; }
.seg button small{ display:block; font-weight:500; font-size:13px; color:var(--ink-3); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.seg button[aria-pressed="true"] small{ color:var(--accent-ink); opacity:.85; }
.field{ display:block; margin-top:14px; }
.field > span{ display:block; font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
.field input,.field select{ width:100%; min-height:48px; padding:0 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); }
.field input[readonly]{ background:var(--raised); color:var(--ink-2); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.check{ display:flex; gap:10px; align-items:center; min-height:44px; margin-top:8px; font-size:15px; }
.check input{ width:22px; height:22px; accent-color:var(--accent); flex:none; }

/* ---------- Home ---------- */
.kpi{ display:grid; grid-template-columns:1.3fr 1fr; gap:0; margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgb(var(--shadow-color) / .06); }
.kpi-main{ padding:16px; border-right:1px solid var(--line); }
.kpi-main b{ display:block; font:700 32px/1.1 var(--font-display); letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; }
.kpi-side{ display:grid; }
.kpi-side > div{ padding:12px 16px; }
.kpi-side > div + div{ border-top:1px solid var(--line); }
.kpi-side b{ font:600 18px/1.2 var(--font-display); font-variant-numeric:tabular-nums; }
.cta{ margin-top:12px; }
.sec{ margin-top:28px; }
.sec-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.sec-h h2{ font:700 20px/1.2 var(--font-display); letter-spacing:-.01em; }
.cal-tools{ display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.cal-tools .title{ flex:1; font:600 17px/1.2 var(--font-display); text-align:center; text-transform:capitalize; }
.cal-tools .icon-btn{ width:40px; height:40px; }
.mode{ display:inline-grid; grid-auto-flow:column; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; }
.mode button{ min-height:40px; padding:0 12px; border:0; background:var(--surface); font-weight:600; font-size:14px; }
.mode button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.dow{ display:grid; grid-template-columns:repeat(7,1fr); font-size:12px; color:var(--ink-3); text-align:center; margin-bottom:4px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.day{ position:relative; min-height:58px; background:var(--surface); border:0; padding:5px 4px 9px; text-align:left; display:block; }
.day .dn{ display:inline-grid; place-items:center; min-width:24px; height:24px; border-radius:12px; font-size:14px; font-weight:600; }
.day.out{ background:var(--raised); color:var(--ink-3); }
.day.today .dn{ background:var(--ink); color:var(--bg); }
.day.sel{ box-shadow:inset 0 0 0 2px var(--accent); z-index:1; }
.day .amt{ display:block; margin:2px 0 0 2px; font-size:11px; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.stripes{ position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:1px; }
.stripe{ height:4px; background:var(--c); }
.stripe.gen{ background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 9px); }
.dot.gen{ border-radius:50%; }
.sw{ display:inline-block; width:22px; height:4px; background:var(--kind-off); vertical-align:middle; margin-right:5px; }
.sw.gen{ background:repeating-linear-gradient(90deg,var(--kind-gen) 0 5px,transparent 5px 8px); }
.kind{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; border:1px solid var(--c); color:var(--c); white-space:nowrap; }
.trip-row.gen{ border-left-style:dashed; }
.type-card{ display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; margin-top:12px; padding:14px; background:var(--surface); border:1px solid var(--line-strong); border-left:6px solid var(--c); border-radius:12px; }
.type-card .tc-ico{ font-size:28px; line-height:1; }
.type-card b{ display:block; font:600 17px/1.25 var(--font-display); }
.type-card small{ display:block; margin-top:4px; font-size:14px; color:var(--ink-2); line-height:1.4; }
.hero.gen .big{ color:var(--ink); }
.chip.sg{ min-width:54px; padding:0 10px; font-weight:700; letter-spacing:.02em; }
.legend-m{ display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; margin:10px 0 0; padding:10px 12px; font-size:14px; background:var(--raised); border-radius:10px; }
.legend-m div{ display:flex; gap:8px; align-items:baseline; padding:3px 0; color:var(--ink-2); }
.legend-m dt{ font-weight:700; min-width:26px; color:var(--ink); }
.legend-m dd{ margin:0; }
.legend-m .on, .legend-m .on dt{ color:var(--accent); font-weight:700; }
.pie{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; }
.pie-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.pie-top .mode button{ min-height:36px; padding:0 12px; font-size:13px; }
.pie svg{ width:100%; max-width:230px; height:auto; display:block; margin:6px auto 4px; }
.pie .sl{ fill:none; stroke-width:34; cursor:pointer; transition:opacity .15s; }
.pie .sl.dim{ opacity:.28; }
.pie .pc-t{ font:700 19px var(--font-display); fill:var(--ink); text-anchor:middle; }
.pie .pc-s{ font:500 10.5px var(--font-body); fill:var(--ink-3); text-anchor:middle; }
.pie-row{ display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; width:100%; min-height:46px; padding:6px 8px; background:transparent; border:0; border-bottom:1px solid var(--line); text-align:left; font-size:15px; }
.pie-row:last-child{ border-bottom:0; }
.pie-row[aria-pressed="true"]{ background:var(--accent-soft); border-radius:8px; }
.pie-row .dot{ width:12px; height:12px; border-radius:50%; }
.pie-row .p{ color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:42px; text-align:right; font-size:14px; }
.pie-row .v{ font-weight:700; font-variant-numeric:tabular-nums; }
.wlist{ border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; }
.wrow{ display:grid; grid-template-columns:56px 1fr auto; gap:10px; align-items:start; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:10px 12px; min-height:56px; position:relative; }
.wrow:last-child{ border-bottom:0; }
.wrow.sel{ box-shadow:inset 3px 0 0 var(--accent); background:var(--accent-soft); }
.wrow .wd b{ display:block; font:700 20px/1 var(--font-display); }
.wrow .wd span{ font-size:13px; color:var(--ink-3); text-transform:capitalize; }
.wrow .wm{ font-size:14px; color:var(--ink-2); min-width:0; }
.wrow .wm strong{ font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px; }
.wrow .wt{ font-weight:600; font-variant-numeric:tabular-nums; }
.dot{ width:10px; height:10px; border-radius:3px; background:var(--c); flex:none; display:inline-block; }
.panel{ margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
.panel h3{ font:600 17px/1.25 var(--font-display); }
.panel .lst{ margin-top:8px; }
.chart{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 12px 10px; }
.chart svg{ width:100%; height:auto; display:block; }
.chart .bar{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; }
.chart .cum{ fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; }
.chart .ax{ fill:var(--ink-3); font-size:9px; font-family:var(--font-body); }
.chart .base{ stroke:var(--line-strong); stroke-width:1; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); margin-top:6px; }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px; }
.trip-row{ display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
.trip-row .r1{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.trip-row strong{ font:600 17px/1.25 var(--font-display); }
.trip-row .tot{ font:700 17px var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap; }
.trip-row .r2{ font-size:14px; color:var(--ink-2); margin-top:2px; }
.bar-track{ height:8px; border-radius:4px; background:var(--raised); overflow:hidden; margin-top:10px; }
.bar-track i{ display:block; height:100%; background:var(--accent); }
.bar-track.over i{ background:var(--warn); }
.empty{ padding:18px; border:1px dashed var(--line-strong); border-radius:12px; color:var(--ink-2); margin-top:16px; }
.empty p + .btn{ margin-top:12px; }

/* ---------- Dettaglio trasferta ---------- */
.meta{ margin-top:14px; font-size:15px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 18px; }
.meta b{ color:var(--ink); font-weight:600; }
.hero{ margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 16px 16px; box-shadow:0 2px 6px rgb(var(--shadow-color) / .07); }
.hero h2{ font:600 15px/1.2 var(--font-body); color:var(--ink-2); }
.hero .big{ font:700 56px/1.05 var(--font-display); letter-spacing:-.03em; margin-top:6px; font-variant-numeric:tabular-nums; font-variation-settings:'opsz' 96; }
.hero .sub{ font-size:14px; color:var(--ink-2); margin-top:6px; max-width:52ch; }
.meals{ margin-top:16px; border-top:1px solid var(--line); }
.meal{ padding:12px 0 6px; border-bottom:1px solid var(--line); }
.meal-h{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-size:14px; }
.meal-h b{ font-weight:600; }
.meal-h .r{ font-weight:700; font-variant-numeric:tabular-nums; }
.meal-h span.c{ color:var(--ink-3); }
.ruler{ position:relative; height:14px; background:var(--raised); border-radius:3px; margin:10px 0 8px; }
.ruler .f,.ruler .g,.ruler .o{ position:absolute; top:0; bottom:0; }
.ruler .f{ background:var(--accent); border-radius:3px 0 0 3px; }
.ruler .g{ background:repeating-linear-gradient(135deg,var(--ok) 0 2px,transparent 2px 6px); }
.ruler .o{ background:var(--warn); }
.ruler .t{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); margin-left:-1px; }
.meal.plain{ font-size:14px; color:var(--ink-2); padding:10px 0; display:flex; justify-content:space-between; gap:10px; }
.legend-r{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--ink-2); margin-top:12px; }
.legend-r i{ display:inline-block; width:14px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px; }
.legend-r .l-f{ background:var(--accent); } .legend-r .l-g{ background:repeating-linear-gradient(135deg,var(--ok) 0 2px,transparent 2px 5px); } .legend-r .l-o{ background:var(--warn); }
.legend-r .l-t{ width:2px; height:12px; background:var(--ink); border-radius:0; }
.tot3{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.tot3 > div{ padding:12px; border-right:1px solid var(--line); min-width:0; }
.tot3 > div:last-child{ border-right:0; }
.tot3 b{ display:block; font:700 17px/1.2 var(--font-display); font-variant-numeric:tabular-nums; margin-top:2px; }
.budget{ margin-top:12px; font-size:14px; color:var(--ink-2); }
.stack{ display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--raised); margin-top:6px; }
.stack i{ display:block; height:100%; background:var(--c); }
.cats{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:10px; font-size:14px; }
.cats div{ display:flex; justify-content:space-between; gap:8px; }
.dayblk{ margin-top:20px; }
.dayblk header{ display:flex; align-items:center; gap:8px; padding-bottom:6px; border-bottom:2px solid var(--ink); }
.dayblk h3{ font:700 17px/1.2 var(--font-display); flex:1; white-space:nowrap; }
.dayblk .dt{ font-weight:600; font-variant-numeric:tabular-nums; }
.exp{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:10px 2px; min-height:56px; }
.exp .n{ font-weight:600; }
.exp .d{ font-size:14px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:2px 8px; align-items:center; }
.exp .a{ grid-row:1 / span 2; grid-column:2; align-self:center; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.exp .a small{ display:block; font-weight:600; font-size:13px; }
.tag{ display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--raised); border:1px solid var(--line); color:var(--ink-2); }
.tag.mm{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.tag.chk{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.none{ font-size:14px; color:var(--ink-3); padding:10px 2px; }
.fab{ position:fixed; left:0; right:0; bottom:0; z-index:4; padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top,var(--bg) 70%,transparent); pointer-events:none; }
.fab .in{ max-width:640px; margin:0 auto; display:flex; gap:10px; pointer-events:auto; }
.fab .btn{ flex:1; box-shadow:0 4px 14px rgb(var(--shadow-color) / .18); }

/* ---------- Sheet ---------- */
.scrim{ position:fixed; inset:0; z-index:20; background:rgb(var(--scrim) / .5); }
.sheet{ position:fixed; z-index:21; left:0; right:0; bottom:0; max-height:92%; overflow:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); transform:translateY(24px); opacity:0; transition:transform .2s ease,opacity .2s ease; margin:0 auto; max-width:600px; box-shadow:0 -6px 30px rgb(var(--shadow-color) / .25); }
.sheet.in{ transform:none; opacity:1; }
.sheet h2{ font:700 22px/1.2 var(--font-display); letter-spacing:-.01em; }
.sheet .grp{ margin-top:14px; }
.sheet .grp > span{ display:block; font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.scan{ margin-top:14px; padding:12px; border-radius:12px; background:var(--accent-soft); }
.scan .btn{ width:100%; background:var(--surface); }
.scan .row2{ gap:8px; margin:0; }
.filebtn{ position:relative; margin-top:10px; }
.filebtn .btn{ width:100%; pointer-events:none; }
.filebtn input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; z-index:1; }
.filebtn input:disabled{ cursor:not-allowed; }
.filebtn:focus-within .btn{ outline:3px solid var(--accent); outline-offset:2px; }
.cam{ width:100%; max-height:55vh; margin-top:12px; border-radius:12px; background:var(--raised); object-fit:cover; }
.paste{ width:100%; min-height:120px; margin-top:8px; padding:10px 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); font:14px/1.4 var(--font-body); color:var(--ink); }
.scan .hint{ margin-top:8px; }
.badge{ margin-top:8px; font-size:14px; font-weight:600; }
.pv{ margin-top:8px; font-size:15px; font-weight:600; }
.err{ margin-top:12px; color:var(--warn); font-weight:600; font-size:14px; min-height:0; }
.actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.actions .btn{ flex:1 1 140px; }
.pick{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); min-height:52px; }
.pick input{ width:22px; height:22px; accent-color:var(--accent); flex:none; margin-top:2px; }
.pick small{ display:block; color:var(--ink-3); font-size:13px; }
.pick label{ flex:1; }
#scanBar{ position:fixed; z-index:6; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); max-width:616px; margin:0 auto; background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 6px 20px rgb(var(--shadow-color) / .25); font-weight:600; }
#scanBar[hidden]{ display:none; }
.vh{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
.scan.off .btn{ opacity:.55; }
.scan .why{ color:var(--warn); font-weight:600; }
#scanBar span{ flex:1; }
#scanBar .sp{ width:18px; height:18px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; }
#scanBar button{ min-height:40px; padding:0 12px; border-radius:10px; border:1px solid var(--line-strong); background:transparent; font-weight:600; }
@keyframes spin{ to{ transform:rotate(360deg); } }
#toast{ position:fixed; z-index:40; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; pointer-events:none; }
#toast .t{ pointer-events:auto; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:600; font-size:15px; display:flex; gap:14px; align-items:center; max-width:560px; box-shadow:0 6px 20px rgb(var(--shadow-color) / .3); }
#toast button{ background:transparent; border:0; color:inherit; font-weight:700; text-decoration:underline; min-height:36px; padding:0 4px; }
@media (min-width:720px){ .sheet{ bottom:24px; border-radius:20px; } }
@media (prefers-reduced-motion:reduce){ .sheet{ transition:none; } #scanBar .sp{ animation-duration:2.4s; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="scanBar" role="status" aria-live="polite" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/*LOGIC:START*/
/* ===================== Regole di business (pure, testabili) ===================== */
const FORM_CODE = '31425'; // codice modulo stampato a pie' di pagina del PDF
const CAP = { normale: 2753, maggiorata: 3011, forfait: 550 }; // in centesimi
const SOGLIA_LABEL = { normale: 'Normale', maggiorata: 'Maggiorata', forfait: 'Forfait' };
const CITTA_MAGGIORATE = ['Bari','Bologna','Cagliari','Cortina','Courmayeur','Firenze','Genova','Milano','Montecatini','Napoli','Palermo','Roma','Sanremo','Taormina','Torino','Trieste','Venezia'];

const CATS = {
  pasto:{label:'Pasti'}, pernottamento:{label:'Pernottamento'}, colazione:{label:'Colazione'}, hotel:{label:'Hotel'},
  tassa:{label:'Tassa di soggiorno'}, pedaggio:{label:'Pedaggio'}, parcheggio:{label:'Parcheggio'},
  pubblico:{label:'Trasporto pubblico', mezzo:'PU'}, treno:{label:'Treno', mezzo:'TR'}, aereo:{label:'Aereo', mezzo:'AE'}, taxi:{label:'Taxi'}, carburante:{label:'Carburante'}, altro:{label:'Altro'}
};
const GROUP_A = ['pasto','pernottamento','colazione','hotel','tassa'];
const GROUP_B = ['pedaggio','parcheggio','pubblico','treno','aereo','taxi','carburante','altro'];
const TICKET = ['pubblico','treno','aereo'];           // titoli di viaggio: tabella "Destinazioni e spese trasporto"
const VARIE = ['tassa','pedaggio','parcheggio','taxi','carburante','altro']; // "Spese varie documentate"
const MEZZI = { AE:'Aereo', TR:'Treno', AS:'Auto sociale', PU:'Pullman o simili', AU:'Auto personale', NA:'Nave', AL:'Altro' };
const mezzoLabel = k => k && MEZZI[k] ? k + ' - ' + MEZZI[k] : '';
const NOTE_CHIPS = ['OFFERTO','PERN. + COL.','1/2 PENS.','PENS. COMPL.','IN VIAGGIO'];

function norm(s){
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}
const CITY_RX = CITTA_MAGGIORATE.map(c => ({ name:c, rx:new RegExp('(^| )' + norm(c) + '( |$)') }));
/** Ritorna il nome della citta' in elenco (soglia maggiorata) oppure null. */
function matchCittaMaggiorata(city){
  const t = norm(city).replace(/\bsan remo\b/,'sanremo');
  if(!t || /\bmilano marittima\b/.test(t)) return null;
  for(const c of CITY_RX) if(c.rx.test(t)) return c.name;
  return null;
}
/** Tipo di viaggio: 'ufficiale' (diaria, massimali, Modulo RAI) oppure 'generico' (solo costi reali). I dati vecchi senza tipo sono ufficiali. */
const isOfficial = t => !t || t.tipo !== 'generico';
function capOf(e){ return e.cat === 'pasto' ? (CAP[e.soglia] != null ? CAP[e.soglia] : CAP.normale) : 0; }
/** Entrano nel Residuo Pasti tutti i pasti fruiti, forfait compreso (importo 5,50 contro il massimale della città). Restano fuori solo i pasti offerti. */
function countsForResidue(e){ return e.cat === 'pasto' && !/offert/i.test(e.note || ''); }
function residueOf(e){ return countsForResidue(e) ? capOf(e) - e.cents : 0; }
/** Residuo Pasti Totale = somma (massimale singolo pasto - importo speso) */
function residuoTotale(list){ return list.reduce((s,e) => s + residueOf(e), 0); }

function groupOf(cat){
  if(cat === 'pasto') return 'pasti';
  if(['pernottamento','hotel','colazione','tassa'].includes(cat)) return 'alloggio';
  if(['pedaggio','parcheggio','pubblico','treno','aereo','taxi','carburante'].includes(cat)) return 'trasporti';
  return 'altro';
}
function totals(list){
  const t = { all:0, dip:0, az:0, by:{pasti:0, alloggio:0, trasporti:0, altro:0} };
  for(const e of list){
    t.all += e.cents;
    if(e.payer === 'azienda') t.az += e.cents; else t.dip += e.cents;
    t.by[groupOf(e.cat)] += e.cents;
  }
  return t;
}

const GROUP_LABEL = { pasti:'Pasti', alloggio:'Alloggio', trasporti:'Trasporti', altro:'Altro' };
/** Dati per il diagramma a torta: per gruppo (4 fette) oppure per singola voce (max 7 fette, il resto in "Altre voci"). */
function pieData(list, mode, maxSlices){
  const m = {};
  for(const e of list){ if(!(e.cents > 0)) continue; const k = mode === 'voci' ? e.cat : groupOf(e.cat); m[k] = (m[k] || 0) + e.cents; }
  const keys = Object.keys(m), total = keys.reduce((s,k) => s + m[k], 0);
  let arr = keys.map(k => ({ key:k, label:mode === 'voci' ? CATS[k].label : GROUP_LABEL[k], cents:m[k] })).sort((a,b) => b.cents - a.cents);
  const max = maxSlices || 7;
  if(arr.length > max){ const rest = arr.slice(max-1); arr = arr.slice(0, max-1).concat([{ key:'_altre', label:'Altre voci', cents:rest.reduce((s,x) => s + x.cents, 0) }]); }
  return { total, slices:arr.map(s => Object.assign({ pct:total ? s.cents/total*100 : 0 }, s)) };
}
const pad = n => String(n).padStart(2,'0');
function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fromISO(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s,n){ const d = fromISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function daysBetween(a,b){ const out = []; let c = a, g = 0; while(c <= b && g++ < 400){ out.push(c); c = addDays(c,1); } return out; }
function todayISO(){ return isoOf(new Date()); }
function mondayOf(s){ const d = fromISO(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return isoOf(d); }

function parseCents(v){
  if(typeof v === 'number') return isFinite(v) ? Math.round(v*100) : NaN;
  let s = String(v == null ? '' : v).replace(/[^\d,.\-]/g,'');
  if(!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(lc > -1) s = s.replace(',','.');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n*100) : NaN;
}
const centsStr = c => (c/100).toFixed(2).replace('.',',');

const sortExp = (a,b) => a.date.localeCompare(b.date) || ((a.sub === 'cena') - (b.sub === 'cena')) || ((a.ts||0) - (b.ts||0));
const byDate = (a,b) => a.date.localeCompare(b.date);

function noteOf(e){
  const p = [];
  if(e.cat === 'pasto'){ if(e.soglia === 'maggiorata') p.push('MM'); if(e.forfait) p.push('FORFAIT'); }
  if(e.cat === 'hotel') p.push('HOTEL');
  if(e.note) p.push(e.note);
  return p.join(' ');
}
function descOf(e){
  const base = {tassa:'Tassa di soggiorno', pedaggio:'Pedaggio', parcheggio:'Parcheggio', altro:'Spesa varia', taxi:'Taxi', carburante:'Carburante', treno:'Treno', aereo:'Aereo', pubblico:'Trasporto pubblico'}[e.cat] || CATS[e.cat].label;
  const det = e.desc || e.city || '';
  return det ? base + ' ' + det : base;
}

/** Righe delle "Diarie a pie' di lista": una riga per data (piu' righe se servono), 1° e 2° pasto, pernottamento, colazione. */
function buildDiarie(list){
  const by = {};
  for(const e of list) if(['pasto','pernottamento','hotel','colazione'].includes(e.cat)) (by[e.date] = by[e.date] || []).push(e);
  const rows = [];
  for(const date of Object.keys(by).sort()){
    const es = by[date];
    const meals = es.filter(e => e.cat === 'pasto').sort((a,b) => ((a.sub === 'cena') - (b.sub === 'cena')) || ((a.ts||0) - (b.ts||0)));
    const pern = es.filter(e => e.cat === 'pernottamento' || e.cat === 'hotel');
    const col = es.filter(e => e.cat === 'colazione');
    const n = Math.max(Math.ceil(meals.length/2), pern.length, col.length, 1);
    for(let i = 0; i < n; i++) rows.push({ date, m1:meals[2*i]||null, m2:meals[2*i+1]||null, p:pern[i]||null, c:col[i]||null });
  }
  return rows;
}
function splitDT(date, time){
  const d = (date || '').split('-'), t = (time || '').split(':');
  return { g:d[2]||'', m:d[1]||'', h:t[0]||'', mi:t[1]||'' };
}
/** Modello dati del modulo (fino a 3 trasferte) */
function buildDistinta(trips, exps){
  trips = trips.slice(0,3);
  const m = { aut:'', matr:'', head:[], transport:[], varie:[], nondoc:[], diarie:[], annot:'' };
  const uniq = a => Array.from(new Set(a.filter(Boolean)));
  m.aut = uniq(trips.map(t => t.aut)).join(' / ');
  m.matr = uniq(trips.map(t => t.matr)).join(' / ');
  const all = [], notes = [];
  trips.forEach((t,i) => {
    const list = exps.filter(e => e.tripId === t.id).sort(sortExp);
    all.push.apply(all, list);
    m.head.push({ n:i+1, ini:splitDT(t.inizio,t.oraIn), fin:splitDT(t.fine,t.oraFin) });
    notes.push('T' + (i+1) + ': ' + t.nome + ', ' + t.dest);
    const arr = t.arrivo || t.inizio, isDest = l => norm(l) === norm(t.dest);   // arrivo scelto alla creazione del viaggio: vale per la riga della destinazione
    const tr = [];
    for(const e of list){
      if(TICKET.includes(e.cat)){
        if(e.lost) m.nondoc.push({ date:e.date, desc:descOf(e), cents:e.cents });
        else tr.push({ trasf:i+1, loc:e.city || t.dest, date:e.arrivo || (isDest(e.city || t.dest) ? arr : e.date), mezzo:e.mezzo || CATS[e.cat].mezzo, dip:e.payer === 'azienda' ? 0 : e.cents, rai:e.payer === 'azienda' ? e.cents : 0 });
      } else if(VARIE.includes(e.cat)){
        m.varie.push({ date:e.date, desc:descOf(e), cents:e.cents });
      }
    }
    const seen = new Set(tr.map(r => norm(r.loc)));
    for(const e of list){
      if(e.cat === 'pernottamento' || e.cat === 'hotel'){
        const loc = e.city || t.dest;
        if(!seen.has(norm(loc))){ seen.add(norm(loc)); tr.push({ trasf:i+1, loc, date:isDest(loc) ? arr : e.date, mezzo:t.mezzo || '', dip:0, rai:0 }); }
      }
    }
    if(!seen.has(norm(t.dest))) tr.push({ trasf:i+1, loc:t.dest, date:arr, mezzo:t.mezzo || '', dip:0, rai:0 });   // la destinazione c'è sempre, con arrivo e mezzo scelti per il viaggio
    if(!tr.length) tr.push({ trasf:i+1, loc:t.dest, date:t.arrivo || t.inizio, mezzo:t.mezzo || '', dip:0, rai:0 });
    tr.sort(byDate);
    m.transport.push.apply(m.transport, tr);
  });
  m.varie.sort(byDate); m.nondoc.sort(byDate);
  m.diarie = buildDiarie(all);
  m.annot = notes.join('; ');
  return m;
}

const EXPORT_HEAD_GEN = ['Viaggio','Data','Categoria','Dettaglio','Città','Importo (EUR)','Pagato da','Mezzo','Documentato','Note'];
const EXPORT_HEAD = ['Trasferta','N. autorizzazione','Data','Categoria','Dettaglio','Città','Soglia pasto','Massimale (EUR)','Importo (EUR)','Residuo pasto (EUR)','Pagato da','Mezzo','Documentato','Note'];
function exportRows(trips, exps){
  const rows = [];
  for(const t of trips){
    for(const e of exps.filter(x => x.tripId === t.id).sort(sortExp)){
      const isMeal = e.cat === 'pasto';
      rows.push([
        t.nome, t.aut || '', e.date,
        CATS[e.cat].label + (isMeal ? ' (' + (e.sub === 'cena' ? 'cena' : 'pranzo') + ')' : ''),
        e.desc || '', e.city || '',
        isMeal ? SOGLIA_LABEL[e.soglia] + (e.forfait ? ' (forfait)' : '') : '',
        isMeal ? CAP[e.soglia]/100 : '',
        e.cents/100,
        countsForResidue(e) ? residueOf(e)/100 : '',
        e.payer === 'azienda' ? 'RAI' : 'Dipendente',
        e.mezzo || CATS[e.cat].mezzo || '',
        e.lost ? 'No' : 'Sì',
        e.note || ''
      ]);
    }
  }
  return rows;
}
/** Righe del report per i viaggi generici: nessuna soglia, massimale o residuo. */
function exportRowsGen(trips, exps){
  const rows = [];
  for(const t of trips) for(const e of exps.filter(x => x.tripId === t.id).sort(sortExp))
    rows.push([t.nome, e.date, CATS[e.cat].label, e.desc || '', e.city || '', e.cents/100, e.payer === 'azienda' ? 'Azienda' : 'Dipendente', e.mezzo || CATS[e.cat].mezzo || '', e.lost ? 'No' : 'Sì', e.note || '']);
  return rows;
}
function toCSV(head, rows){
  const cell = v => {
    let s = typeof v === 'number' ? v.toFixed(2).replace('.',',') : String(v == null ? '' : v);
    s = s.replace(/"/g,'""');
    return /[;"\r\n]/.test(s) ? '"' + s + '"' : s;
  };
  return '\uFEFF' + [head].concat(rows).map(r => r.map(cell).join(';')).join('\r\n');
}
function clampDate(d, t){ return d < t.inizio ? t.inizio : d > t.fine ? t.fine : d; }
const SCAN_CATS = ['pasto','colazione','pernottamento','hotel','tassa','pedaggio','parcheggio','pubblico','treno','aereo','taxi','carburante','altro'];
const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && isoOf(fromISO(s)) === s;
/** Trasforma la lettura OCR (scontrino, fattura, biglietto) in una spesa. Ritorna { exp, extra } oppure { error }.
    "check" elenca cio' che l'utente deve controllare (dati mancanti o dubbi). */
function expenseFromScan(r, trip, today){
  if(!r || typeof r !== 'object') return { error:'Risposta non valida' };
  const total = r.importo == null ? NaN : parseCents(r.importo);
  if(!isFinite(total) || total <= 0) return { error:'Importo non leggibile' };
  const check = [];
  let cat = SCAN_CATS.indexOf(r.categoria) > -1 ? r.categoria : null;
  if(!cat){ cat = 'altro'; check.push('categoria'); }
  let date = validISO(r.data) ? r.data : null;
  if(!date){ date = clampDate(today, trip); check.push('data'); }
  else if(date < trip.inizio || date > trip.fine) check.push('data fuori dalla trasferta');
  let city = typeof r.citta === 'string' ? r.citta.trim() : '';
  if(!city){ city = trip.dest; check.push('città'); }
  let cents = total, extra = null;
  const tassa = r.tassa_soggiorno == null ? NaN : parseCents(r.tassa_soggiorno);
  if((cat === 'pernottamento' || cat === 'hotel') && isFinite(tassa) && tassa > 0 && tassa < total){
    cents = total - tassa;
    extra = { date, cat:'tassa', sub:'', soglia:'', cents:tassa, city, desc:'', note:'', payer:'dipendente', mezzo:'', lost:false, check:check.slice() };
  }
  let sub = '';
  if(cat === 'pasto'){
    const m = typeof r.ora === 'string' && /^(\d{1,2}):\d{2}$/.exec(r.ora);
    if(m) sub = parseInt(m[1],10) < 16 ? 'pranzo' : 'cena'; else { sub = 'pranzo'; check.push('pranzo o cena'); }
  }
  const esercente = typeof r.esercente === 'string' ? r.esercente.trim().slice(0,60) : '';
  const tratta = typeof r.tratta === 'string' ? r.tratta.trim().slice(0,60) : '';
  const isTk = TICKET.indexOf(cat) > -1;
  const exp = { date, cat, sub, soglia:cat === 'pasto' ? (matchCittaMaggiorata(city) ? 'maggiorata' : 'normale') : '', cents,
    city, desc:isTk ? (tratta || esercente) : esercente, note:'', payer:'dipendente', mezzo:isTk ? CATS[cat].mezzo : '', lost:false, check };
  return { exp, extra };
}
/*LOGIC:END*/

/* ===================== Stato e persistenza ===================== */
const STORE_KEY = 'distinta.trasferte.v1';
const S = { trips:[], exps:[], settings:{ theme:'auto', matricola:'', apiKey:'', model:'' }, ui:{ view:'home', tripId:null, cal:'month', ref:todayISO(), sel:todayISO(), filter:'all', pieMode:'gruppi', pieSel:null } };
let X = null;               // bozza della spesa aperta nel foglio
let T_ = null;              // bozza trasferta
let EX = { sel:[] };        // selezione per l'esportazione
const caps = { ready:false, env:false, sample:null, images:false, imgTypes:[], downloads:null };
let capsP = Promise.resolve();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); S.trips = (d.trips || []).map(t => Object.assign({ tipo:'ufficiale' }, t)); S.exps = (d.exps || []).map(e => { if(e.cat === 'pasto' && e.soglia === 'forfait'){ e.forfait = true; e.soglia = matchCittaMaggiorata(e.city) ? 'maggiorata' : 'normale'; } return e; }); S.settings = Object.assign(S.settings, d.settings || {}); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({ trips:S.trips, exps:S.exps, settings:S.settings })); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
const tripById = id => S.trips.find(t => t.id === id);
const expsOf = id => S.exps.filter(e => e.tripId === id);
const $ = (s,r) => (r || document).querySelector(s);
const $$ = (s,r) => Array.from((r || document).querySelectorAll(s));

/* ===================== Formattazione ===================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfEur = new Intl.NumberFormat('it-IT',{ style:'currency', currency:'EUR' });
const nfNum = new Intl.NumberFormat('it-IT',{ minimumFractionDigits:2, maximumFractionDigits:2 });
const eur = c => nfEur.format(c/100);
const money = c => (c < 0 ? '−' : '') + nfEur.format(Math.abs(c)/100);
const signed = c => (c > 0 ? '+' : c < 0 ? '−' : '') + nfNum.format(Math.abs(c)/100);
const fd = (iso, o) => fromISO(iso).toLocaleDateString('it-IT', o);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function fmtRange(a,b){
  const A = fromISO(a), B = fromISO(b);
  if(a === b) return fd(a,{day:'numeric',month:'long',year:'numeric'});
  if(A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()) return A.getDate() + '–' + fd(b,{day:'numeric',month:'short',year:'numeric'});
  return fd(a,{day:'numeric',month:'short'}) + ' – ' + fd(b,{day:'numeric',month:'short',year:'numeric'});
}

/* ---------- Diagramma a torta delle spese ---------- */
const PIE_GROUP_COLOR = { pasti:1, alloggio:2, trasporti:3, altro:4 };
function pieHTML(list){
  const mode = S.ui.pieMode, d = pieData(list, mode);
  const modeBtns = '<div class="mode" role="group" aria-label="Raggruppa la torta">' + [['gruppi','Gruppi'],['voci','Voci']].map(x => '<button data-act="pie-mode" data-v="' + x[0] + '" aria-pressed="' + (mode === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
  if(!d.total) return '<div class="pie"><div class="pie-top">' + modeBtns + '</div><p class="hint" style="margin-top:10px">Nessuna spesa da mostrare: la torta compare appena registri la prima spesa.</p></div>';
  const col = (s,i) => 'var(--pie-' + (mode === 'gruppi' ? (PIE_GROUP_COLOR[s.key] || 4) : s.key === '_altre' ? 8 : (i % 7) + 1) + ')';
  const R = 70, C = 2*Math.PI*R, sel = d.slices.find(s => s.key === S.ui.pieSel) || null, gap = d.slices.length > 1 ? 1.4 : 0;
  let cum = 0;
  const arcs = d.slices.map((s,i) => {
    const len = s.cents/d.total*C, dash = Math.max(0.5, len - gap);
    const el = '<circle class="sl' + (sel && sel.key !== s.key ? ' dim' : '') + '" cx="100" cy="100" r="' + R + '" style="stroke:' + col(s,i) + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2) + '" stroke-dashoffset="' + (-cum).toFixed(2) + '" data-act="pie-sel" data-key="' + esc(s.key) + '"/>';
    cum += len; return el;
  }).join('');
  const pctTxt = p => p < 1 ? '<1%' : Math.round(p) + '%';
  const center = sel
    ? '<text class="pc-s" x="100" y="92">' + esc(sel.label) + '</text><text class="pc-t" x="100" y="113">' + esc(eur(sel.cents)) + '</text><text class="pc-s" x="100" y="128">' + pctTxt(sel.pct) + ' del totale</text>'
    : '<text class="pc-s" x="100" y="94">Totale</text><text class="pc-t" x="100" y="116">' + esc(eur(d.total)) + '</text>';
  return '<div class="pie"><div class="pie-top"><span class="k" style="color:var(--ink-2)">Tocca una fetta per il dettaglio</span>' + modeBtns + '</div>' +
    '<svg viewBox="0 0 200 200" role="img" aria-label="Diagramma a torta, totale ' + esc(eur(d.total)) + ': ' + esc(d.slices.map(s => s.label + ' ' + pctTxt(s.pct)).join(', ')) + '"><g transform="rotate(-90 100 100)">' + arcs + '</g>' + center + '</svg>' +
    '<div>' + d.slices.map((s,i) => '<button class="pie-row" data-act="pie-sel" data-key="' + esc(s.key) + '" aria-pressed="' + (!!sel && sel.key === s.key) + '"><i class="dot" style="--c:' + col(s,i) + '; background:' + col(s,i) + '"></i><span>' + esc(s.label) + '</span><span class="p">' + pctTxt(s.pct) + '</span><span class="v">' + eur(s.cents) + '</span></button>').join('') + '</div></div>';
}

function chartHTML(){
  const days = S.ui._days || [];
  const inMonth = S.ui.cal === 'month' ? days.filter(d => fromISO(d).getMonth() === fromISO(S.ui.ref).getMonth()) : days;
  const daily = inMonth.map(sumOn); let c = 0; const cum = daily.map(v => c += v);
  if(!c) return '<div class="chart"><p class="hint">Nessuna spesa nel periodo mostrato nel calendario.</p></div>';
  const W = 320, H = 130, pl = 6, pr = 6, pt = 12, pb = 20, n = inMonth.length, bw = (W-pl-pr)/n;
  const maxD = Math.max.apply(null, daily), ph = H-pt-pb;
  let bars = '', pts = [];
  daily.forEach((v,i) => {
    const h = v ? Math.max(2, v/maxD*ph*0.85) : 0;
    if(h) bars += '<rect class="bar" x="' + (pl+i*bw+bw*.14).toFixed(1) + '" y="' + (H-pb-h).toFixed(1) + '" width="' + (bw*.72).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"/>';
    pts.push((pl+i*bw+bw/2).toFixed(1) + ',' + (H-pb-cum[i]/c*ph).toFixed(1));
  });
  const lab = (i,anchor) => '<text class="ax" x="' + (pl+i*bw+bw/2).toFixed(1) + '" y="' + (H-5) + '" text-anchor="' + anchor + '">' + fromISO(inMonth[i]).getDate() + '</text>';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spesa giornaliera e cumulata, totale ' + eur(c) + '">' +
    '<line class="base" x1="' + pl + '" x2="' + (W-pr) + '" y1="' + (H-pb) + '" y2="' + (H-pb) + '"/>' + bars +
    '<polyline class="cum" points="' + pts.join(' ') + '"/>' + lab(0,'start') + lab(Math.floor((n-1)/2),'middle') + lab(n-1,'end') +
    '<text class="ax" x="' + (W-pr) + '" y="9" text-anchor="end">' + esc(eur(c)) + '</text></svg>' +
    '<div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Spesa del giorno</span><span><i style="background:var(--ink)"></i>Totale cumulato</span></div></div>';
}

/* ---------- Dettaglio trasferta ---------- */
function expRow(e){
  const t = tripById(e.tripId), off = isOfficial(t), res = off ? residueOf(e) : 0;
  const tags = [];
  if(off && e.cat === 'pasto'){ tags.push('<span class="tag' + (e.soglia === 'maggiorata' ? ' mm' : '') + '">' + SOGLIA_LABEL[e.soglia] + '</span>'); if(e.forfait) tags.push('<span class="tag">Forfait</span>'); }
  if(e.payer === 'azienda') tags.push('<span class="tag">' + (off ? 'Pagato da RAI' : 'Pagato dall’azienda') + '</span>');
  if(e.lost) tags.push('<span class="tag">Non documentato</span>');

    '<span class="d">' + (e.city ? '<span>' + esc(e.city) + '</span>' : '') + tags.join('') + '</span></button>';

function rulerBlock(meals){
  const counted = meals.filter(countsForResidue).sort(sortExp);
  const others = meals.filter(e => !countsForResidue(e)).sort(sortExp);
  const scale = Math.max(CAP.maggiorata, Math.max.apply(null, [0].concat(counted.map(e => e.cents))));
  const pc = v => (v/scale*100).toFixed(2) + '%';
  return counted.map(e => {
    const cap = capOf(e), spent = Math.min(e.cents, cap), over = Math.max(0, e.cents - cap), r = residueOf(e);
    return '<div class="meal"><div class="meal-h"><span><b>' + mealName(e) + (e.forfait ? ' a forfait' : '') + '</b> <span class="c">' + esc(fd(e.date,{day:'numeric',month:'short'})) + (e.city ? ', ' + esc(e.city) : '') + '</span></span>' +
      '<span class="r ' + (r < 0 ? 'neg' : 'pos') + '">' + signed(r) + '</span></div>' +
      '<div class="ruler" role="img" aria-label="Speso ' + eur(e.cents) + ' su massimale ' + eur(cap) + '">' +
        '<i class="f" style="left:0;width:' + pc(spent) + '"></i>' +
        (r > 0 ? '<i class="g" style="left:' + pc(spent) + ';width:' + pc(cap-spent) + '"></i>' : '') +
        (over ? '<i class="o" style="left:' + pc(cap) + ';width:' + pc(over) + '"></i>' : '') +
        '<i class="t" style="left:' + pc(cap) + '"></i></div>' +
      '<div class="hint">' + (e.forfait ? 'Forfait ' : 'Speso ') + eur(e.cents) + ', massimale ' + eur(cap) + (e.soglia === 'maggiorata' ? ' (soglia maggiorata)' : '') + '</div></div>';
  }).join('') + others.map(e =>
    '<div class="meal plain"><span>' + mealName(e) + ', ' + esc(fd(e.date,{day:'numeric',month:'short'})) + '</span><span>' + 'Offerto ' + eur(e.cents) + ', fuori dal residuo</span></div>').join('') +
    (counted.length ? '<div class="legend-r"><span><i class="l-f"></i>Speso</span><span><i class="l-g"></i>Residuo</span><span><i class="l-o"></i>Sforo</span><span><i class="l-t"></i>Massimale</span></div>' : '');
}

function viewTrip(){

  const meals = list.filter(e => e.cat === 'pasto'), counted = meals.filter(countsForResidue);
  const dates = Array.from(new Set(daysBetween(t.inizio, t.fine).concat(list.map(e => e.date)))).sort();
  const cats = [['Pasti','pasti','--trip-1'],['Alloggio','alloggio','--trip-2'],['Trasporti','trasporti','--trip-3'],['Altro','altro','--trip-4']];
  const bud = t.budget ? '<p class="budget">Budget ' + eur(t.budget) + ': ' + (tot.all > t.budget ? '<b class="neg">superato di ' + eur(tot.all - t.budget) + '</b>' : 'restano <b class="pos">' + eur(t.budget - tot.all) + '</b>') + '</p><div class="bar-track ' + (tot.all > t.budget ? 'over' : '') + '"><i style="width:' + Math.min(100, Math.round(tot.all/t.budget*100)) + '%"></i></div>' : '';

/** Legge il file scelto come data URL con FileReader. */
function readDataURL(file){
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error || new Error('lettura del file non riuscita')); r.readAsDataURL(file); });
}
function dataURLtoBlob(u){
  const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(u);
  if(!m) throw new Error('data URL non valido');
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]), a = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type:m[1] || 'application/octet-stream' });
}
/** Foto scelta -> data URL (FileReader) -> JPEG ridimensionato da inviare al motore OCR. Il motore accetta Blob, non URL. */
async function prepImage(file){
  const url = await readDataURL(file);
  try{
    const img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1800 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
    const g = c.getContext('2d'); g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--print-paper').trim() || 'white'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    if(blob && blob.size) return blob;
  }catch(e){}
  const raw = dataURLtoBlob(url), type = raw.type || file.type;
  if(raw.size && (!caps.imgTypes.length || caps.imgTypes.indexOf(type) > -1)) return new Blob([raw], { type });
  throw { code:'image_rejected', message:'formato non leggibile' };
}

/** Righe "data; importo; città; categoria; esercente; ora", una per spesa. */
function parseLines(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const p = line.split(';').map(x => x.trim());
    if(p.length < 3 || !isFinite(parseCents(p[1]))) return;
    let d = p[0]; const m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(d);
    if(m) d = (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    const cat = norm(p[3] || ''), ora = p[5] || (cat === 'cena' ? '20:00' : cat === 'pranzo' ? '13:00' : null);
    out.push({ data:d, importo:p[1], citta:p[2], categoria:CAT_ALIAS[cat] || null, esercente:p[4] || null, ora });
  });
  return out;
}
function parseReads(text){
  const s = String(text || ''), a = s.indexOf('['), b = s.lastIndexOf(']'), c = s.indexOf('{'), d = s.lastIndexOf('}');
  const raw = a > -1 && b > a && (c === -1 || a < c) ? s.slice(a, b+1) : (c > -1 && d > c ? s.slice(c, d+1) : '');
  if(raw){
    try{ let v = JSON.parse(raw); if(!Array.isArray(v)) v = Array.isArray(v.spese) ? v.spese : [v]; return v; }catch(e){}
  }
  const l = parseLines(s); if(l.length) return l;
  throw new Error('nessun dato trovato');
}

  showSheet('<h2>Impostazioni</h2>' +
    '<div class="grp"><span>Lettura degli scontrini</span></div>' +
    '<label class="field" style="margin-top:0"><span>Chiave API di Anthropic</span><input id="s-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="' + esc(S.settings.apiKey || '') + '"></label>' +
    '<label class="field"><span>Modello (facoltativo)</span><input id="s-model" type="text" autocomplete="off" autocapitalize="off" placeholder="claude-sonnet-5" value="' + esc(S.settings.model || '') + '"></label>' +
    '<p class="hint" style="margin-top:6px">La chiave resta solo su questo telefono e viene usata solo per inviare a Anthropic le foto che scansioni. Ogni foto ha un costo di pochi centesimi. Puoi crearla su console.anthropic.com.</p>' +
    '<div class="actions"><button class="btn primary" data-act="save-settings">Salva</button></div>' +
    '<div class="grp" style="margin-top:22px"><span>Installazione</span></div>' +
    (isStandalone() ? '<p class="hint">L’app è già installata su questo telefono.</p>'
      : installEvt ? '<button class="btn block" data-act="install-app">Installa l’app sul telefono</button>'
      : ios ? '<p class="hint">Su iPhone: tocca il pulsante Condividi di Safari, poi “Aggiungi alla schermata Home”.</p>'
      : '<p class="hint">Apri il menu del browser e scegli “Installa app” oppure “Aggiungi a schermata Home”.</p>') +
    '<div class="grp" style="margin-top:22px"><span>Dati e backup</span></div>' +
    '<p class="hint">I viaggi e le spese sono salvati solo su questo telefono (archiviazione persistente: ' + persisted + '). Fai ogni tanto un backup: se cancelli i dati del browser o disinstalli l’app, si perdono.</p>' +
    '<button class="btn block" style="margin-top:10px" data-act="backup-save">' + ico('down') + 'Scarica il backup dei dati</button>' +
    '<div class="filebtn"><span class="btn">Ripristina da un backup</span><input type="file" id="restoreFile" accept="application/json,.json" aria-label="Ripristina da un backup"></div>' +
    '<p class="err" id="sheetErr" role="alert"></p>' +
    '<div class="actions"><button class="btn" data-act="close-sheet">Chiudi</button></div>', 'Impostazioni');
}
function saveSettings(){
  S.settings.apiKey = ($('#s-key').value || '').trim(); S.settings.model = ($('#s-model').value || '').trim();
  useApiEngine(); save(); closeSheet(); toast(S.settings.apiKey ? 'Impostazioni salvate: lettura scontrini attiva' : 'Impostazioni salvate');
}
function backupSave(){
  const d = { app:'distinta-trasferte', versione:1, esportato:new Date().toISOString(), trips:S.trips, exps:S.exps, settings:{ theme:S.settings.theme, matricola:S.settings.matricola } };
  saveFile('backup-distinta-' + todayISO() + '.json', JSON.stringify(d, null, 1));
}
async function restoreBackup(file){
  const err = m => { const el = $('#sheetErr'); if(el) el.textContent = m; };
  if(!file) return;
  let d; try{
    const txt = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsText(file); });
    d = JSON.parse(txt);
  }catch(e){ return err('Il file non è un backup valido.'); }
  if(!d || !Array.isArray(d.trips) || !Array.isArray(d.exps)) return err('Il file non è un backup di questa app.');
  if(!confirm('Sostituire i dati attuali con il backup? (' + d.trips.length + ' viaggi, ' + d.exps.length + ' spese)')) return;
  S.trips = d.trips.map(t => Object.assign({ tipo:'ufficiale' }, t));
  S.exps = d.exps.map(e => { if(e.cat === 'pasto' && e.soglia === 'forfait'){ e.forfait = true; e.soglia = matchCittaMaggiorata(e.city) ? 'maggiorata' : 'normale'; } return e; });
  if(d.settings){ if(d.settings.theme) S.settings.theme = d.settings.theme; if(d.settings.matricola) S.settings.matricola = d.settings.matricola; }
  S.ui.view = 'home'; applyTheme(); save(); closeSheet(); render(); toast('Backup ripristinato');
}

/* ===================== Eventi ===================== */
const ACT = {
  'theme': () => { const o = ['auto','light','dark']; S.settings.theme = o[(o.indexOf(S.settings.theme)+1) % 3]; applyTheme(); save(); render(); toast(THEME_LABEL[S.settings.theme]); },
  'new-trip': b => openTypePicker(b.dataset.date),
  'pick-type': b => openTrip(null, { date:b.dataset.date || undefined, tipo:b.dataset.tipo }),
  'set-mezzo': b => { T_.mezzo = T_.mezzo === b.dataset.v ? '' : b.dataset.v; paintMezzo(); },
  'set-tipo': b => { T_.tipo = b.dataset.v; $('.sheet').innerHTML = tripSheetHTML(); },
  'pie-sel': b => { S.ui.pieSel = S.ui.pieSel === b.dataset.key ? null : b.dataset.key; render(); },
  'pie-mode': b => { S.ui.pieMode = b.dataset.v; S.ui.pieSel = null; render(); },
  'set-filter': b => { S.ui.filter = b.dataset.v; S.ui.pieSel = null; render(); },
  'set-extipo': b => { EX.tipo = b.dataset.v; const l = tripsOfType(EX.tipo); EX.sel = l[0] ? [l[0].id] : []; $('.sheet').innerHTML = exportSheetHTML(); paintExport(); },
  'edit-trip': b => openTrip(b.dataset.id),
  'open-trip': b => { S.ui.pieSel = null; S.ui.view = 'trip'; S.ui.tripId = b.dataset.id; render(); window.scrollTo(0,0); },
  'back': () => { S.ui.pieSel = null; S.ui.view = 'home'; render(); },
  'add-exp': b => openExpense(null, { tripId:b.dataset.trip, date:b.dataset.date }),
  'edit-exp': b => openExpense(b.dataset.id),
  'quick-forfait': b => quickForfait(b.dataset.date),
  'cal-mode': b => { S.ui.cal = b.dataset.mode; render(); },
  'cal-prev': () => { shiftCal(-1); }, 'cal-next': () => { shiftCal(1); },
  'cal-today': () => { S.ui.ref = todayISO(); S.ui.sel = todayISO(); render(); },
  'sel-day': b => { S.ui.sel = b.dataset.date; if(S.ui.cal === 'month' && fromISO(b.dataset.date).getMonth() !== fromISO(S.ui.ref).getMonth()) S.ui.ref = b.dataset.date; render(); },
  'close-sheet': () => closeSheet(),
  'save-trip': () => saveTrip(),
  'del-trip': b => {
    if(!T_.confirmDel){ T_.confirmDel = true; b.textContent = 'Conferma eliminazione'; return; }
    const id = T_.id; S.trips = S.trips.filter(t => t.id !== id); S.exps = S.exps.filter(e => e.tripId !== id); save(); closeSheet(); S.ui.view = 'home'; render(); toast('Trasferta eliminata');
  },
  'save-exp': () => saveExpense(),
  'del-exp': () => { const id = X.id, old = S.exps.find(e => e.id === id); S.exps = S.exps.filter(e => e.id !== id); save(); closeSheet(); render(); toast('Spesa eliminata', 'Annulla', () => { S.exps.push(old); save(); render(); }); },
  'set': b => {
    const k = b.dataset.set, v = b.dataset.v; X[k] = v;
    if(k === 'soglia'){ X.manual = true; }
    if(k === 'cat'){ if(v !== 'pasto'){ if(X.forfait && X.amount === '5,50'){ X.amount = ''; $('#f-amount').value = ''; } X.forfait = false; } X.mezzo = CATS[v].mezzo || ''; autoSoglia(); renderDyn(); }
    paintDyn();
  },
  'note-chip': b => {
    const v = b.dataset.v, has = X.note.toUpperCase().indexOf(v) > -1;
    X.note = has ? X.note.split(v).join('').replace(/\s+/g, ' ').trim() : (X.note.trim() ? X.note.trim() + ' ' + v : v);
    $('#f-note').value = X.note; paintDyn();
  },
  'scan-multi': () => openScanPicker(),
  'open-settings': () => openSettings(),
  'save-settings': () => saveSettings(),
  'install-app': async () => { if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; closeSheet(); },
  'backup-save': () => backupSave(),
  'paste-open': () => openPaste(),
  'diag-open': () => openDiag(),
  'paste-import': () => importPasted(),
  'paste-copy': async () => { const el = $('#pasteAsk'); try{ await navigator.clipboard.writeText(PASTE_PROMPT); toast('Richiesta copiata'); }catch(e){ el.focus(); el.select(); toast('Selezionata: copiala con il menu del telefono', '', null, 5000); } },
  'scan-stop': () => { if(scanCtl) scanCtl.abort(); },
  'open-export': b => openExport(b.dataset.id),
  'ex-toggle': b => { const id = b.dataset.id, i = EX.sel.indexOf(id); if(i > -1) EX.sel.splice(i,1); else if(EX.sel.length < EX_MAX[EX.tipo]) EX.sel.push(id); paintExport(); },
  'do-pdf': () => doPdf(), 'do-xlsx': () => doXlsx(), 'do-csv': () => doCsv(),
  'demo': () => loadDemo(),
  'toast-act': () => { const el = $('#toast'); if(el._fn) el._fn(); el.innerHTML = ''; }
};
function shiftCal(dir){
  if(S.ui.cal === 'month'){ const R = fromISO(S.ui.ref); S.ui.ref = isoOf(new Date(R.getFullYear(), R.getMonth()+dir, 1)); }
  else S.ui.ref = addDays(S.ui.ref, 7*dir);
  render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act; if(a === 'ex-toggle') return; // gestito da 'change'
  if(ACT[a]) ACT[a](b, e);
});
document.addEventListener('change', e => {
  const b = e.target.closest('[data-act="ex-toggle"]'); if(b){ ACT['ex-toggle'](b); return; }
  if(e.target.id === 'restoreFile'){ const inp = e.target; restoreBackup(inp.files && inp.files[0]).then(() => { inp.value = ''; }); return; }
  if(e.target.id === 'diagFile' || e.target.id === 'diagCam'){ const f = e.target.files && e.target.files[0]; const m = $('#diagFileMsg'); if(m){ m.textContent = f ? 'Ricevuto: ' + f.name + ', ' + (f.type || 'tipo sconosciuto') + ', ' + Math.round(f.size/1024) + ' KB. Il selettore funziona.' : 'Nessun file ricevuto.'; m.className = 'hint pos'; } return; }
  if(e.target.id === 'ocr-input' || e.target.id === 'ocr-gallery'){
    const inp = e.target, fs = Array.prototype.slice.call(inp.files || []);
    if(X){ runScan(fs[0]).then(() => { inp.value = ''; }); return; }   // foglio della singola spesa
    closeSheet(); scanBatch(fs).then(() => { inp.value = ''; }); return;      // scansione dal dettaglio viaggio
  }
  if(e.target.id === 'scanFile'){ const inp = e.target, f = inp.files && inp.files[0]; runScan(f).then(() => { inp.value = ''; }); return; }
  const f = e.target.closest('[data-f]');
  if(f && X){ X[f.dataset.f] = f.type === 'checkbox' ? f.checked : f.value; }
});
document.addEventListener('input', e => {
  const tf = e.target.closest('[data-tf]'); if(tf && T_){
    const k = tf.dataset.tf; T_[k] = tf.value;
    if(k === 'arrivo') T_.arrivoManual = true;
    if(k === 'inizio' && !T_.arrivoManual){ T_.arrivo = tf.value; const a = $('#t-arrivo'); if(a) a.value = tf.value; }   // finché non lo cambi tu, l’arrivo segue l’inizio
    return;
  }
  const f = e.target.closest('[data-f]'); if(!f || !X) return;
  X[f.dataset.f] = f.type === 'checkbox' ? f.checked : f.value;
  if(f.dataset.f === 'city'){ autoSoglia(); }
  if(f.dataset.f === 'forfait' && !f.checked && X.amount === '5,50'){ X.amount = ''; $('#f-amount').value = ''; }
  paintDyn();
});
document.addEventListener('paste', e => {
  if(S.ui.view !== 'trip' || $('.sheet') || !e.clipboardData) return;
  const fs = Array.prototype.slice.call(e.clipboardData.files || []).filter(f => /^image\//.test(f.type));
  if(fs.length){ e.preventDefault(); scanBatch(fs); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('.sheet')) closeSheet(); });

/* ===================== Avvio ===================== */
/** Tasto indietro di Android: chiude il foglio aperto o torna all'elenco dei viaggi. Ritorna true se l'ha gestito. */
window.__androidBack = () => {
  if($('.sheet')){ closeSheet(); return true; }
  if(S.ui.view === 'trip'){ ACT['back'](); return true; }
  return false;
};
load(); applyTheme(); render(); capsP = initCaps();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.AndroidBridge) navigator.serviceWorker.register('sw.js').catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
