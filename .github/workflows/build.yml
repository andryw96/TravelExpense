name: Crea APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila l'APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina il file
        run: cp app/build/outputs/apk/release/app-release.apk TravelExpense.apk

      - name: Allega l'APK al lavoro (zip)
        uses: actions/upload-artifact@v4
        with:
          name: distinta-trasferte-apk
          path: TravelExpense.apk

      - name: Pubblica l'APK nella sezione Releases (link diretto per il telefono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ultima TravelExpense.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TravelExpense (ultima versione)" \
            --notes "APK pronto da installare su Android. Aprilo dal telefono e consenti l'installazione da questa fonte."
